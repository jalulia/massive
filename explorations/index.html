*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#000;color:#fff}
main{width:min(1680px,87.5%);margin:auto;padding:clamp(40px,5vw,96px) 0 96px}

.collection{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px}
a{color:inherit;text-decoration:none;display:block;min-width:0}

.frame{aspect-ratio:16/9;background:#000;overflow:hidden;outline:1px solid #282828;outline-offset:-1px;transition:outline-color .18s}
.frame img{width:100%;height:100%;display:block;object-fit:contain}
h2{display:flex;justify-content:space-between;align-items:baseline;gap:20px;font:400 clamp(16px,1.15vw,22px)/1.4 Input,monospace;margin:20px 0 0}
h2 svg{width:16px;height:16px;flex:none;stroke:currentColor;stroke-width:1.25;fill:none}
a:hover .frame{outline-color:#aaa}a:hover h2{color:#ccc}
@media(min-width:1921px){main{padding-top:96px}}
@media(max-width:1000px){main{width:88%;padding-top:48px}.collection{grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 28px}header{margin-bottom:40px}h2{font-size:17px}}
@media(max-width:560px){main{width:auto;margin:0 24px;padding:40px 0 56px}header{display:block;margin-bottom:36px}h1{font-size:56px}header p{margin-top:18px;font-size:16px}.collection{grid-template-columns:1fr;gap:36px}h2{margin-top:16px;font-size:18px}}
@media(prefers-reduced-motion:reduce){.frame{transition:none}}
</style>
</head>
