</style></head><body><main id="stage"><section class="board bleed  " data-number="1" aria-label="Play"><video class="media" muted playsinline preload="metadata" loop src="presentation-assets/C01_PLAY.mp4" poster="presentation-assets/C01_PLAY.png" aria-label="Play"></video></section><section class="board   " data-number="2" aria-label="MASSIVE"><h1 class="title-word">MASSIVE</h1><p class="subtitle">Making the invisible playable</p></section><section class="board   " data-number="3" aria-label="Cosmos"><img class="photo" src="presentation-assets/cosmos-cover-user.png" alt="Cosmos"></section><section class="board   " data-number="4" aria-label="The inscription"><img class="photo" src="presentation-assets/sagan-signature-user.jpg" alt="The inscription"></section><section class="board  archive " data-number="5" aria-label="Flatland: the observer"><video class="media" muted playsinline preload="metadata" src="presentation-assets/01_ABSOLUTELY_FLAT_silent.mp4" poster="presentation-assets/01_ABSOLUTELY_FLAT.jpg" aria-label="Flatland: the observer"></video><p class="label">FLATLAND</p></section><section class="board   " data-number="6" aria-label="One plane"><video class="media" muted playsinline preload="metadata" loop src="presentation-assets/C12_PLANE_DIAGRAM.mp4" poster="presentation-assets/C12_PLANE_DIAGRAM.png" aria-label="One plane"></video><svg class="callouts" viewBox="0 0 1920 1080" aria-hidden="true"><g fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.25"><path d="M670 284L765 375"/><path d="M1188 438L1092 520"/><path d="M1308 794L1204 740"/></g></svg><p class="callout" style="left:552px;top:270px">PLAYER</p><p class="callout" style="left:1200px;top:414px">ENEMY</p><p class="callout" style="left:1320px;top:804px">CORE</p><p class="label">ONE PLANE</p></section><section class="board   " data-number="7" aria-label="NOVA and the player"><video class="media" muted playsinline preload="metadata" loop src="presentation-assets/C13_NOVA_DIAGRAM.mp4" poster="presentation-assets/C13_NOVA_DIAGRAM.png" aria-label="NOVA and the player"></video><p class="label">NOVA</p></section><section class="board   " data-number="8" aria-label="Powers of Ten"><div class="scale-grid"><img src="presentation-assets/scale-01.png" alt="Powers of Ten selected frame 1"><img src="presentation-assets/scale-02.png" alt="Powers of Ten selected frame 2"><img src="presentation-assets/scale-03.png" alt="Powers of Ten selected frame 3"><img src="presentation-assets/scale-04.png" alt="Powers of Ten selected frame 4"><img src="presentation-assets/scale-05.png" alt="Powers of Ten selected frame 5"><img src="presentation-assets/scale-06.png" alt="Powers of Ten selected frame 6"><img src="presentation-assets/scale-07.png" alt="Powers of Ten selected frame 7"><img src="presentation-assets/scale-08.png" alt="Powers of Ten selected frame 8"></div></section><section class="board   " data-number="9" aria-label="Chladni"><video class="media" muted playsinline preload="metadata" loop src="presentation-assets/HARVARD_CHLADNI.mp4" poster="presentation-assets/HARVARD_CHLADNI.png" aria-label="Chladni"></video></section><section class="board   " data-number="10" aria-label="Resonance formation and contact"><video class="media" muted playsinline preload="metadata" loop src="presentation-assets/GDD_RESONANCE.mp4" poster="presentation-assets/GDD_RESONANCE.png" aria-label="Resonance formation and contact"></video><p class="label">RESONANCE</p></section><section class="board   " data-number="11" aria-label="Resonance interaction"><video class="media" muted playsinline preload="metadata" loop src="presentation-assets/C04b_RESONANCE_CONTACT.mp4" poster="presentation-assets/C04b_RESONANCE_CONTACT.png" aria-label="Resonance interaction"></video></section><section class="board   " data-number="12" aria-label="Probability"><img class="photo" src="presentation-assets/hydrogen-4d-reference.png" alt="Probability"></section><section class="board   " data-number="13" aria-label="ORBITAL"><video class="media" muted playsinline preload="metadata" loop src="presentation-assets/C05_ORBITAL_MODEL.mp4" poster="presentation-assets/C05_ORBITAL_MODEL.png" aria-label="ORBITAL"></video><p class="label">ORBITAL</p></section><section class="board   " data-number="14" aria-label="ORBITAL encounter"><video class="media" muted playsinline preload="metadata" loop src="presentation-assets/C05_ORBITAL.mp4" poster="presentation-assets/C05_ORBITAL.png" aria-label="ORBITAL encounter"></video></section><section class="board   " data-number="15" aria-label="Magnetosphere"><video class="media" muted playsinline preload="metadata" loop src="presentation-assets/NASA_MAGNETOSPHERE.mp4" poster="presentation-assets/NASA_MAGNETOSPHERE.png" aria-label="Magnetosphere"></video></section><section class="board label-space  " data-number="16" aria-label="DYNAMO"><video class="media" muted playsinline preload="metadata" loop src="presentation-assets/C06_DYNAMO_MODEL.mp4" poster="presentation-assets/C06_DYNAMO_MODEL.png" aria-label="DYNAMO"></video><p class="label">DYNAMO</p></section><section class="board label-space  " data-number="17" aria-label="Shelter"><video class="media" muted playsinline preload="metadata" loop src="presentation-assets/C06_DYNAMO.mp4" poster="presentation-assets/C06_DYNAMO.png" aria-label="Shelter"></video></section><section class="board  archive " data-number="18" aria-label="Flatland: a crossing"><video class="media" muted playsinline preload="metadata" src="presentation-assets/04_DESCENT_silent.mp4" poster="presentation-assets/04_DESCENT.jpg" aria-label="Flatland: a crossing"></video><p class="label">FLATLAND</p></section><section class="board   " data-number="19" aria-label="The plane folds"><video class="media" muted playsinline preload="metadata" loop src="presentation-assets/C07_SINGULARITY_MODEL.mp4" poster="presentation-assets/C07_SINGULARITY_MODEL.png" aria-label="The plane folds"></video><p class="label">SINGULARITY</p></section><section class="board   " data-number="20" aria-label="One direction, two views"><video class="media" muted playsinline preload="metadata" loop src="presentation-assets/C11_FOLDED_UNFOLDED.mp4" poster="presentation-assets/C11_FOLDED_UNFOLDED.png" aria-label="One direction, two views"></video><p class="label">ONE DIRECTION. TWO VIEWS.</p></section><section class="board   " data-number="21" aria-label="Traversal and passage"><video class="media" muted playsinline preload="metadata" loop src="presentation-assets/GDD_SINGULARITY.mp4" poster="presentation-assets/GDD_SINGULARITY.png" aria-label="Traversal and passage"></video></section><section class="board   " data-number="22" aria-label="Structure formation"><video class="media" muted playsinline preload="metadata" loop src="presentation-assets/ILLUSTRIS_STRUCTURE.mp4" poster="presentation-assets/ILLUSTRIS_STRUCTURE.png" aria-label="Structure formation"></video></section><section class="board   " data-number="23" aria-label="COSMOS"><video class="media" muted playsinline preload="metadata" loop src="presentation-assets/C08_COSMOS_MODEL.mp4" poster="presentation-assets/C08_COSMOS_MODEL.png" aria-label="COSMOS"></video><p class="label">COSMOS</p></section><section class="board bleed  " data-number="24" aria-label="Play, again"><video class="media" muted playsinline preload="metadata" loop src="presentation-assets/C01_PLAY.mp4" poster="presentation-assets/C01_PLAY.png" aria-label="Play, again"></video></section><section class="board   closing" data-number="25" aria-label="MASSIVE"><h1 class="title-word">MASSIVE</h1></section></main><div id="blackout"></div><aside id="notes"></aside><script>const NOTES=[{"name": "Play", "notes": "Suggested dwell: 25 seconds.\n\nPlay without introduction. One player, one Core, one response.\n\n\u201cThis is MASSIVE, a competitive arcade game for two or four people. You move, attack, defend, collect, and try to finish with the higher energy score. But I want to start with the smallest thing on this screen: the player.\u201d\nSilent, staged game or reference footage. Repeats preserve native forward action; any black reset is an editorial boundary. Source and staging details: capture report in the project folder.", "seconds": 25}, {"name": "MASSIVE", "notes": "Suggested dwell: 10 seconds.\n\nMASSIVE. Matt Fry. Museum of the Moving Image, 17 October 2026.", "seconds": 10}, {"name": "Cosmos", "notes": "Suggested dwell: 55 seconds.\n\nMatt\u2019s own account of Cosmos. Let the photograph hold. Do not imply he met Sagan or received it personally.", "seconds": 55}, {"name": "The inscription", "notes": "Suggested dwell: 25 seconds.\n\nThe inscription. No text while this holds.", "seconds": 25}, {"name": "Flatland: the observer", "notes": "Suggested dwell: 35 seconds.\n\nCarl Sagan uses his hands to describe being confined to a plane. The selected 2.5-second gesture plays once, at normal speed; R replays it.\n\n\u201cImagine being confined to a plane. A world can extend beyond what you can perceive.\u201d\n\nEdwin A. Abbott, Flatland (1884), is the literary source. https://www.gutenberg.org/ebooks/45506 . Cosmos footage: https://www.youtube.com/watch?v=UnURElCzGc0 . Available transfer is labeled AI-upscaled by YouTube; no further enhancement. Julia approved modest framing with archival texture. This is a perception analogy, not a physical model of a black hole. The low-resolution original scans remain in the source archive, not enlarged on screen.", "seconds": 35}, {"name": "One plane", "notes": "Suggested dwell: 60 seconds.\n\nFixed oblique view, live Unity assets. Player and enemy enlarged for legibility.\n\n\u201cEnemies and power-ups have volume, but the player\u2019s interaction with them is concentrated at its own level.\u201d\nSilent, staged game or reference footage. Repeats preserve native forward action; any black reset is an editorial boundary. Source and staging details: capture report in the project folder.\n\nFlatland is the connection: a limited observer moving within a larger world. In MASSIVE the flat player meets volumetric enemies and power-ups at its own level. The surface also makes shared movement and combat readable. This is a design analogy, not a literal picture of four-dimensional spacetime. Flatland: https://www.gutenberg.org/ebooks/45506 . Gravity reference: https://www.einstein-online.info/en/GeomGravity/ .", "seconds": 60}, {"name": "NOVA and the player", "notes": "Suggested dwell: 55 seconds.\n\nThe same plane beside NOVA\u2019s particle volume.\n\n\u201cThat is also a useful way to make a multiplayer game: everyone shares a readable surface, and you can judge distance, direction, and contact.\u201d\n\n\u201cThe grid is a deliberate reduction. It gives us something we can see, move through, and understand.\u201d\nSilent, staged game or reference footage. Repeats preserve native forward action; any black reset is an editorial boundary. Source and staging details: capture report in the project folder.", "seconds": 55}, {"name": "Powers of Ten", "notes": "Suggested dwell: 80 seconds.\n\nCharles and Ray Eames, Powers of Ten (1977). Matt approached MASSIVE by showing this film: an organizing principle and a way of seeing.\n\nTop row: human, Earth, solar system, galaxy. Bottom row: galaxy groups, cell, DNA, atom. These are selected scales, not equal steps or a calibrated scale chart. The film\u2019s atom is carbon, not hydrogen.\n\n\u201cThese are different ways of giving us access to something beyond our normal experience.\u201d\n\nhttps://www.eamesoffice.com/the-work/powers-of-ten/ . Charles and Ray Eames / Eames Office for IBM. Still frames from the already prepared reference-motion package, using its same clean crop. That package uses a 2880\u00d72160 online transfer whose scan provenance is undocumented. It is not claimed to restore detail absent from the official 640\u00d7480 source. Native film color and texture retained.", "seconds": 80}, {"name": "Chladni", "notes": "Suggested dwell: 35 seconds.\n\nHarvard Natural Sciences Lecture Demonstrations, Chladni Plates. Original video, 01:30\u201301:50, silent. A bow excites the plate; changing contact points changes its boundary conditions and the visible sand pattern. Sand gathers along nodes of the vibration. This is a physical demonstration, not an animated reconstruction.\n\n\u201cA vibrating plate can reveal a pattern through grains gathering along its quieter lines.\u201d\n\nhttps://sciencedemonstrations.fas.harvard.edu/presentations/chladni-plates\nhttps://www.youtube.com/watch?v=lRFysSAxWxI\nFull source framing retained, with short black entry and exit transitions.", "seconds": 35}, {"name": "Resonance formation and contact", "notes": "Suggested dwell: 45 seconds.\n\nThe exact 14-second Resonance formation and contact clip from the GDD. Original Unity presentation preview: formation, preview-triggered compression/pulses, recovery and dissolution. No actors or score awards. The source caption bands are matted; the game picture and timing are unchanged.\n\n\u201cThe plate gives me a structure. In MASSIVE, selected parts of that structure become something you can meet.\u201d\n\nSource: https://mattfryed.notion.site/MASSIVE-11e617c6d8ae4eeda7f0424645db5203, section 3.10. Follow with real Core contact on the next board.", "seconds": 45}, {"name": "Resonance interaction", "notes": "Suggested dwell: 60 seconds.\n\nTwo real deflections. The Core is set in motion for the shot, not launched by a player.\n\n\u201cThe plate inspires the pattern. Its behavior in the arena is designed for the game. Your route and your approach begin to matter.\u201d\nSilent, staged game or reference footage. Repeats preserve native forward action; any black reset is an editorial boundary. Source and staging details: capture report in the project folder.", "seconds": 60}, {"name": "Probability", "notes": "Suggested dwell: 40 seconds.\n\nHydrogen probability density, computed for this deck. Mathematical illustration.\n\n\u201cThese dots give a picture of a distribution. They aren\u2019t little planets travelling around hidden tracks.\u201d\n\nHydrogen illustration: n=4, l=2, m=0. Reference: https://ocw.mit.edu/courses/18-755-lie-groups-and-lie-algebras-ii-spring-2024/mit18_755_s24_lec12.pdf . The rendered points illustrate probability density; they are not measured electron paths.", "seconds": 40}, {"name": "ORBITAL", "notes": "Suggested dwell: 35 seconds.\n\nThe same kind of distribution, adapted for play.\n\n\u201cA pattern can tell you where an interaction is. A probability field tells you how likely it is.\u201d\nSilent, staged game or reference footage. Repeats preserve native forward action; any black reset is an editorial boundary. Source and staging details: capture report in the project folder.", "seconds": 35}, {"name": "ORBITAL encounter", "notes": "Suggested dwell: 65 seconds.\n\nWatch the upper lobe. First strike at 6.5 s.\n\n\u201cThe denser regions also make encounters more likely. Entering them can kick the player off course and release a small resource. The visible distribution and the encounter chances are connected.\u201d One strike shows the event, not the rate.\nSilent, staged game or reference footage. Repeats preserve native forward action; any black reset is an editorial boundary. Source and staging details: capture report in the project folder.", "seconds": 65}, {"name": "Magnetosphere", "notes": "Suggested dwell: 40 seconds.\n\nNASA Goddard / CIL, Wes Buchanan and Krystofer Kim. Energetic particles from the left, deflected by Earth\u2019s magnetosphere. Conceptual animation.\n\n\u201cA magnetosphere gives me a changing shape of protection.\u201d\nSilent, staged game or reference footage. Repeats preserve native forward action; any black reset is an editorial boundary. Source and staging details: capture report in the project folder.\nSource: https://svs.gsfc.nasa.gov/14892 . NASA Goddard / CIL.", "seconds": 40}, {"name": "DYNAMO", "notes": "Suggested dwell: 35 seconds.\n\nThe game\u2019s authored field and incoming flow, wind from the same side.\nSilent, staged game or reference footage. Repeats preserve native forward action; any black reset is an editorial boundary. Source and staging details: capture report in the project folder.", "seconds": 35}, {"name": "Shelter", "notes": "Suggested dwell: 65 seconds.\n\nPoint out the small player at the left before playing. Exposure from 6 s; back in shelter by 14 s.\n\n\u201cOutside the shelter, the storm pushes and erodes the player. The useful place to stand changes, so you have to read the field and move with it.\u201d\nSilent, staged game or reference footage. Repeats preserve native forward action; any black reset is an editorial boundary. Source and staging details: capture report in the project folder.", "seconds": 65}, {"name": "Flatland: a crossing", "notes": "Suggested dwell: 25 seconds.\n\nCarl Sagan lowers the square into the surface. This 2.1-second gesture plays once, at normal speed; R replays it.\n\n\u201cReturn to Flatland. What happens outside our plane can appear inside it as a sudden event.\u201d\n\nEdwin A. Abbott, Flatland (1884), is the literary source. https://www.gutenberg.org/ebooks/45506 . Cosmos footage: https://www.youtube.com/watch?v=UnURElCzGc0 . Available transfer is labeled AI-upscaled by YouTube; no further enhancement. Julia approved modest framing with archival texture. This is a perception analogy, not a physical model of a black hole. The low-resolution original scans remain in the source archive, not enlarged on screen.", "seconds": 25}, {"name": "The plane folds", "notes": "Suggested dwell: 40 seconds.\n\n\u201cSo far the player has moved within a familiar surface. What happens when that surface itself connects differently?\u201d\nSilent, staged game or reference footage. Repeats preserve native forward action; any black reset is an editorial boundary. Source and staging details: capture report in the project folder.", "seconds": 40}, {"name": "One direction, two views", "notes": "Suggested dwell: 60 seconds.\n\nLeft: the recorded traversal. Right: the same coordinates, unfolded.\n\n\u201cThe player is still bound to its surface. What changes is how that surface connects. Keep moving in one direction and you travel onto the other side.\u201d\nSilent, staged game or reference footage. Repeats preserve native forward action; any black reset is an editorial boundary. Source and staging details: capture report in the project folder.\n\nBoth panels are rendered together in Unity. Right-hand marker follows the actual player surface coordinates with loop distance unwrapped. It is an explanatory coordinate plot, not a second camera or a physical flat-world simulation. The native player visual is enlarged 2\u00d7 for audience legibility; the actual surface coordinates drive the right-hand marker.", "seconds": 60}, {"name": "Traversal and passage", "notes": "Suggested dwell: 50 seconds.\n\nThe exact 21-second SINGULARITY traversal and passage clip from the GDD. Scripted upward input through the real controller completes the folded-surface loop. The staged black-hole approach exercises actual pull, tidal entry, face transfer and exit. The middle close-up is HALF SPEED; opening and closing are normal speed. Player mass and life state are preserved. Caption bands are matted, game content and timing unchanged.\n\n\u201cOr use the central passage. The player has not acquired another set of controls, but its understanding of the arena has to change.\u201d\n\nAn authored passage between faces, not a claim that astrophysical black holes are traversable. Source: https://mattfryed.notion.site/MASSIVE-11e617c6d8ae4eeda7f0424645db5203, section 4.3.", "seconds": 50}, {"name": "Structure formation", "notes": "Suggested dwell: 30 seconds.\n\nCredit: Illustris Collaboration / Illustris Simulation. Original structure-formation movie, 00:06\u201300:30, native speed. This portion shows the dark matter density field in a 10 Mpc comoving region as cosmic structure develops. A numerical simulation visualization. The source\u2019s lower annotation band is cropped; no synthetic material or color remapping.\n\n\u201cThese filaments and dense knots come from a scientific simulation. In the game, that structure becomes another way to organize a world.\u201d\n\nhttps://www.illustris-project.org/media/\nhttps://www.illustris-project.org/movies/illustris_movie_rot_sub_frame.mp4\nSay \u201cfrom the Illustris Collaboration\u201d aloud; written credit is retained here.", "seconds": 30}, {"name": "COSMOS", "notes": "Suggested dwell: 45 seconds.\n\n\u201cAt the other end of the scale, the world becomes a web of filaments, knots, and empty regions.\u201d Authored geometric rules, not a cosmological solver.\nSilent, staged game or reference footage. Repeats preserve native forward action; any black reset is an editorial boundary. Source and staging details: capture report in the project folder.", "seconds": 45}, {"name": "Play, again", "notes": "Suggested dwell: 25 seconds.\n\nReplay without a cue. Let the audience read it now.\nSilent, staged game or reference footage. Repeats preserve native forward action; any black reset is an editorial boundary. Source and staging details: capture report in the project folder.", "seconds": 25}, {"name": "MASSIVE", "notes": "Suggested dwell: 25 seconds.\n\n\u201cYou can\u2019t take in all of it, but you can notice a pattern, try something, and feel a response. That\u2019s where the science becomes part of playing.\u201d\n\nAlternative end: return to the book.", "seconds": 25}];
const stage=document.querySelector('#stage'),boards=[...document.querySelectorAll('.board')];
let index=0;
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`scale(${s})`;stage.style.left=(innerWidth-1920*s)/2+'px';stage.style.top=(innerHeight-1080*s)/2+'px'}
function noteView(){const panel=document.querySelector('#notes');panel.replaceChildren();const h=document.createElement('h1');h.textContent=`${index+1} / ${boards.length} — ${NOTES[index].name}`;const p=document.createElement('p');p.textContent=NOTES[index].notes;panel.append(h,p)}
function show(n){index=Math.max(0,Math.min(boards.length-1,n));boards.forEach((b,i)=>{b.classList.toggle('active',i===index);b.setAttribute('aria-hidden',String(i!==index));for(const v of b.querySelectorAll('video')){if(i===index){v.currentTime=0;v.play().catch(()=>{})}else v.pause()}});history.replaceState(null,'','#'+(index+1));noteView()}
function replay(){for(const v of boards[index].querySelectorAll('video')){v.currentTime=0;v.play().catch(()=>{})}}
addEventListener('resize',fit);
addEventListener('keydown',e=>{
if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(index+1)}
if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}
if(e.key==='Home')show(0);if(e.key==='End')show(boards.length-1);
if(e.key.toLowerCase()==='f'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}
if(e.key.toLowerCase()==='p'){for(const v of boards[index].querySelectorAll('video'))v.paused?v.play().catch(()=>{}):v.pause()}
if(e.key.toLowerCase()==='r')replay();
if(e.key.toLowerCase()==='b')document.body.classList.toggle('blank');
if(e.key.toLowerCase()==='n'){document.body.classList.toggle('notes');noteView()}
});
addEventListener('click',()=>{if(!document.body.classList.contains('notes'))for(const v of boards[index].querySelectorAll('video'))if(v.paused&&!v.ended)v.play().catch(()=>{})});
fit();document.fonts.ready.then(()=>{const n=Number(location.hash.slice(1));show(Number.isInteger(n)?n-1:0)});
window.momi={show,replay,get index(){return index},get count(){return boards.length}};
</script></body></html>
